<!doctype html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScamGuard Documentation Portal</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600;700&family=Sarabun:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #12172B;
      --ink-soft: #1C2340;
      --paper: #F6F4EE;
      --paper-warm: #EFE9DA;
      --rule: #DBD5C6;
      --indigo: #3D4B94;
      --indigo-deep: #2A3570;
      --amber: #C1832A;
      --text-main: #1B1F2B;
      --text-muted: #6B6F7D;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: rgba(107, 111, 125, 0.4) transparent;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(107, 111, 125, 0.3);
      border-radius: 4px;
    }

    body {
      min-width: 320px;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--text-main);
      font-family: 'Sarabun', sans-serif;
      background-color: var(--paper);
      background-image: radial-gradient(circle at 1px 1px, oklch(.47 .06 271 / .13) 1px, transparent 0);
      background-size: 18px 18px;
    }

    .portal {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      height: 100vh;
    }

    .sidebar {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      padding: 30px 18px 20px;
      overflow-y: auto;
      color: var(--paper);
      background: var(--ink);
    }

    .brand {
      padding: 4px 14px 28px;
      border-bottom: 1px solid rgb(246 244 238 / .16);
    }

    .brand-mark,
    .doc-number {
      font: 500 .75rem/1.4 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      color: var(--amber);
    }

    .brand h1 {
      margin: 8px 0 0;
      color: var(--paper);
      font: 600 1.85rem/1.1 'Taviraj', serif;
    }

    .project-name {
      margin: 8px 0 0;
      color: rgb(246 244 238 / .68);
      font-size: .85rem;
      line-height: 1.45;
    }

    .nav-group {
      margin-top: 20px;
    }

    .nav-list {
      display: grid;
      gap: 5px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-item {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      min-height: 54px;
      padding: 6px 10px;
      color: rgb(246 244 238 / .75);
      text-align: left;
      cursor: pointer;
      background: transparent;
      border: 0;
      border-left: 3px solid transparent;
      font: 500 .95rem/1.2 'Sarabun', sans-serif;
      transition: all .3s ease;
    }

    .nav-item:hover,
    .nav-item.is-active {
      color: var(--paper);
      background: var(--ink-soft);
      border-left-color: var(--amber);
    }

    .stamp {
      display: grid;
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      place-items: center;
      color: rgb(246 244 238 / .45);
      font: 500 .75rem 'IBM Plex Mono', monospace;
      border: 1px solid rgb(246 244 238 / .15);
      border-radius: 4px;
      transition: all .3s ease;
    }

    .nav-item:hover .stamp,
    .nav-item.is-expanded .stamp {
      color: var(--ink);
      background: var(--amber);
      border-color: var(--amber);
      transform: rotate(-7deg);
    }

    .nav-copy {
      display: grid;
      gap: 2px;
    }

    /* Dropdown/Accordion styling */
    .sub-menu-container {
      display: none;
      padding: 4px 0 4px 44px;
    }

    .sub-item {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: rgb(246 244 238 / .6);
      font-size: .85rem;
      padding: 6px 8px;
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
      border-radius: 4px;
    }

    .sub-item:hover,
    .sub-item.is-active {
      color: var(--paper);
      background: rgba(255, 255, 255, 0.05);
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: space-between;
      padding: 12px clamp(20px, 4vw, 48px);
      background: var(--paper-warm);
      border-bottom: 1px solid var(--rule);
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--indigo);
      font: 500 .75rem/1.3 'IBM Plex Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      color: var(--text-main);
      font: 600 1.5rem/1.15 'Taviraj', serif;
    }

    .doc-number {
      padding: 8px 10px;
      color: var(--indigo-deep);
      border: 1px solid var(--rule);
      background: var(--paper);
    }

    .viewer {
      position: relative;
      min-height: 0;
      padding: clamp(16px, 2.5vw, 32px);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 540px;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }
    /* Mobile Responsive Styles */
    .menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--ink);
      cursor: pointer;
      padding: 6px;
      margin-left: -8px;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(18, 23, 43, 0.4);
      backdrop-filter: blur(2px);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.open {
      display: block;
      opacity: 1;
    }

    @media (max-width: 850px) {
      .portal {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: fixed;
        top: 0; left: -320px;
        width: 292px;
        height: 100vh;
        z-index: 100;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 4px 0 24px rgba(18, 23, 43, 0.2);
      }
      .sidebar.open {
        left: 0;
      }
      .menu-btn {
        display: block;
      }
      .doc-number {
        display: none; /* Hide doc number on small screens to save space */
      }
      .topbar {
        padding: 12px 20px;
      }
      .page-title {
        font-size: 1.15rem;
      }
      .eyebrow {
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <div class="portal">

      <div class="brand"><span class="brand-mark">ScamGuard</span>
        <h1>Documentation</h1>

      <nav>

              </div>

            <li>

                <button class="sub-item" data-cat="1" data-sub="5">&bull; Mobile App Architecture</button>
                <button class="sub-item" data-cat="1" data-sub="6">&bull; System Flowchart</button>
                <button class="sub-item" data-cat="1" data-sub="7">&bull; UX/UI & System Design Overview</button>
                <button class="sub-item" data-cat="1" data-sub="8">&bull; การเชื่อมต่อบริการภายนอก (External Integrations)</button>

              </div>
            </li>
            <li>
              <button class="nav-item category-toggle" type="button" data-cat="2">
                <span class="stamp">03</span>
                <span class="nav-copy">
                  <span class="nav-phase">Concepts</span>
                </span>
              </button>
              <div id="cat-2" class="sub-menu-container">
                <button class="sub-item" data-cat="2" data-sub="0">&bull; AI Model Training Workflow</button>
                <button class="sub-item" data-cat="2" data-sub="1">&bull; Error Level Analysis (ELA)</button>

                <button class="sub-item" data-cat="2" data-sub="5">&bull; โมเดล AI — SegFormer</button>
              </div>
            </li>
            <li>
              <button class="nav-item category-toggle" type="button" data-cat="3">
                <span class="stamp">04</span>
                <span class="nav-copy">
                  <span class="nav-phase">Requirements</span>
                </span>
              </button>
              <div id="cat-3" class="sub-menu-container">
                <button class="sub-item" data-cat="3" data-sub="0">&bull; Software Requirements Specification (SRS)</button>
                <button class="sub-item" data-cat="3" data-sub="1">&bull; Use Case Diagram</button>
                <button class="sub-item" data-cat="3" data-sub="2">&bull; ความต้องการที่ไม่ใช่ฟังก์ชัน (Non-Functional Requirements)</button>
                <button class="sub-item" data-cat="3" data-sub="3">&bull; ความต้องการเชิงฟังก์ชัน (Functional Requirements)</button>
                <button class="sub-item" data-cat="3" data-sub="4">&bull; วัตถุประสงค์และตัวชี้วัดความสำเร็จ (Objectives & KPIs)</button>
              </div>
            </li>
            <li>
              <button class="nav-item category-toggle" type="button" data-cat="4">
                <span class="stamp">05</span>

                  <span class="nav-phase">Entities</span>
                </span>
              </button>
              <div id="cat-4" class="sub-menu-container">
                <button class="sub-item" data-cat="4" data-sub="0">&bull; ผู้ใช้ระบบ (Actors)</button>
                <button class="sub-item" data-cat="4" data-sub="1">&bull; เทคโนโลยีที่ใช้ (Technology Stack)</button>
              </div>
            </li>
            <li>
              <button class="nav-item category-toggle" type="button" data-cat="5">
                <span class="stamp">06</span>
                <span class="nav-copy">
                  <span class="nav-phase">Planning</span>
                </span>
              </button>
              <div id="cat-5" class="sub-menu-container">
                <button class="sub-item" data-cat="5" data-sub="0">&bull; Backend Documentation</button>
                <button class="sub-item" data-cat="5" data-sub="1">&bull; ขอบเขตโครงการ (Project Scope)</button>
                <button class="sub-item" data-cat="5" data-sub="2">&bull; ทีมงานและผู้รับผิดชอบ (Team)</button>
              </div>
            </li>
            <li>
              <button class="nav-item category-toggle" type="button" data-cat="6">
                <span class="stamp">07</span>
                <span class="nav-copy">
                  <span class="nav-phase">Decisions</span>
                </span>
              </button>
              <div id="cat-6" class="sub-menu-container">
                <button class="sub-item" data-cat="6" data-sub="0">&bull; การตัดสินใจเลือกเทคโนโลยี (Technology Choices)</button>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </aside>
    <main>
      <header class="topbar">
        <div style="display: flex; align-items: center; gap: 14px;">
          <button id="menu-btn" class="menu-btn" aria-label="Open menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div>
            <p class="eyebrow" id="breadcrumb">เนื้อหา</p>
            <h2 class="page-title" id="documentTitle">Overview</h2>
          </div>
        </div>
        <div class="doc-number" id="documentNumber">DOC 01/07</div>
      </header>
      <section class="viewer">
        <iframe id="contentFrame" src=""></iframe>
      </section>
    </main>
  </div>
  <script>
    const documents = [{"phase": "เนื้อหา · OVERVIEW", "title": "Overview", "sub_titles": [{"title": "ภาพรวมโปรเจค — Scam Image Detection", "path": "wed-ScamGuard/overview.html"}]}, {"phase": "เนื้อหา · ARCHITECTURE", "title": "Architecture", "sub_titles": [{"title": "AI Inference Service", "path": "wed-ScamGuard/architecture/ai-inference-service.html"}, {"title": "Backend API — FastAPI Orchestrator", "path": "wed-ScamGuard/architecture/backend-api.html"}, {"title": "C1 System Context Diagram", "path": "wed-ScamGuard/architecture/c1-system-context-diagram.html"}, {"title": "C2 Container Diagram", "path": "wed-ScamGuard/architecture/c2-container-diagram.html"}, {"title": "Entity Relationship Diagram (ER Diagram)", "path": "wed-ScamGuard/architecture/database-er-diagram.html"}, {"title": "Mobile App Architecture", "path": "wed-ScamGuard/architecture/mobile-design.html"}, {"title": "System Flowchart", "path": "wed-ScamGuard/architecture/flowchart.html"}, {"title": "UX/UI & System Design Overview", "path": "wed-ScamGuard/architecture/design-overview.html"}, {"title": "การเชื่อมต่อบริการภายนอก (External Integrations)", "path": "wed-ScamGuard/architecture/external-integrations.html"}, {"title": "สถาปัตยกรรม Mobile App", "path": "wed-ScamGuard/architecture/mobile-app.html"}, {"title": "สถาปัตยกรรมระบบ (System Architecture)", "path": "wed-ScamGuard/architecture/system-architecture.html"}, {"title": "โครงสร้างฐานข้อมูลและการจัดเก็บข้อมูล", "path": "wed-ScamGuard/architecture/database-schema.html"}]}, {"phase": "เนื้อหา · CONCEPTS", "title": "Concepts", "sub_titles": [{"title": "AI Model Training Workflow", "path": "wed-ScamGuard/concepts/model-training.html"}, {"title": "Error Level Analysis (ELA)", "path": "wed-ScamGuard/concepts/ela-technique.html"}, {"title": "การคำนวณคะแนนความเสี่ยง (Risk Scoring)", "path": "wed-ScamGuard/concepts/risk-scoring.html"}, {"title": "การวิเคราะห์หลายชั้น (Multi-layer Analysis)", "path": "wed-ScamGuard/concepts/multi-layer-analysis.html"}, {"title": "ปัญญาประดิษฐ์ที่อธิบายได้ (Explainable AI / XAI)", "path": "wed-ScamGuard/concepts/explainable-ai.html"}, {"title": "โมเดล AI — SegFormer", "path": "wed-ScamGuard/concepts/ai-model-segformer.html"}]}, {"phase": "เนื้อหา · REQUIREMENTS", "title": "Requirements", "sub_titles": [{"title": "Software Requirements Specification (SRS)", "path": "wed-ScamGuard/requirements/srs.html"}, {"title": "Use Case Diagram", "path": "wed-ScamGuard/requirements/use-case-diagram.html"}, {"title": "ความต้องการที่ไม่ใช่ฟังก์ชัน (Non-Functional Requirements)", "path": "wed-ScamGuard/requirements/non-functional-requirements.html"}, {"title": "ความต้องการเชิงฟังก์ชัน (Functional Requirements)", "path": "wed-ScamGuard/requirements/functional-requirements.html"}, {"title": "วัตถุประสงค์และตัวชี้วัดความสำเร็จ (Objectives & KPIs)", "path": "wed-ScamGuard/requirements/objectives-kpis.html"}]}, {"phase": "เนื้อหา · ENTITIES", "title": "Entities", "sub_titles": [{"title": "ผู้ใช้ระบบ (Actors)", "path": "wed-ScamGuard/entities/actors.html"}, {"title": "เทคโนโลยีที่ใช้ (Technology Stack)", "path": "wed-ScamGuard/entities/tech-stack.html"}]}, {"phase": "เนื้อหา · PLANNING", "title": "Planning", "sub_titles": [{"title": "Backend Documentation", "path": "wed-ScamGuard/planning/backend-documentation.html"}, {"title": "ขอบเขตโครงการ (Project Scope)", "path": "wed-ScamGuard/planning/project-scope.html"}, {"title": "ทีมงานและผู้รับผิดชอบ (Team)", "path": "wed-ScamGuard/planning/team.html"}]}, {"phase": "เนื้อหา · DECISIONS", "title": "Decisions", "sub_titles": [{"title": "การตัดสินใจเลือกเทคโนโลยี (Technology Choices)", "path": "wed-ScamGuard/decisions/technology-choices.html"}]}];
    const frame = document.getElementById('contentFrame');
    const navItems = [...document.querySelectorAll('.nav-item')];

    function toggleDropdown(index) {
      const navItem = document.querySelector(`.nav-item[data-cat="${index}"]`);
      const subContainer = document.getElementById(`cat-${index}`);
      const isExpanded = navItem.classList.contains('is-expanded');

      // Close all others
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('is-expanded'));
      document.querySelectorAll('.sub-menu-container').forEach(container => container.style.display = 'none');

      // Toggle current
      if (!isExpanded) {
        navItem.classList.add('is-expanded');
        subContainer.style.display = 'block';
      }
    }

    function loadDocument(catIndex, subIndex) {
      const doc = documents[catIndex];
      const subDoc = doc.sub_titles[subIndex];

      // Update UI breadcrumbs
      document.getElementById('breadcrumb').textContent = doc.phase;
      document.getElementById('documentTitle').textContent = subDoc.title;
      document.getElementById('documentNumber').textContent = `DOC ${String(catIndex + 1).padStart(2, '0')}`;

      // Update active sub-item
      document.querySelectorAll('.sub-item').forEach(el => el.classList.remove('is-active'));
      const activeSubBtn = document.querySelector(`.sub-item[data-cat="${catIndex}"][data-sub="${subIndex}"]`);
      if (activeSubBtn) activeSubBtn.classList.add('is-active');

      // Load iframe
      frame.title = subDoc.title;
      frame.src = subDoc.path;
    }

    // Mobile sidebar toggle
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      
      // Handle display change for transition
      if (overlay.classList.contains('open')) {
        overlay.style.display = 'block';
        setTimeout(() => overlay.style.opacity = '1', 10);
      } else {
        overlay.style.opacity = '0';
        setTimeout(() => {
          if(!overlay.classList.contains('open')) overlay.style.display = 'none';
        }, 300);
      }
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    document.addEventListener('click', (e) => {
      const navItem = e.target.closest('.nav-item');
      if (navItem) {
        const index = Number(navItem.dataset.cat);
        toggleDropdown(index);
      }

      const subItem = e.target.closest('.sub-item');
      if (subItem) {
        const catIndex = Number(subItem.dataset.cat);
        const subIndex = Number(subItem.dataset.sub);
        loadDocument(catIndex, subIndex);
        
        // Auto-close sidebar on mobile after selecting a document
        if (window.innerWidth <= 850 && sidebar.classList.contains('open')) {
          toggleSidebar();
        }
      }
    });

    // Open first category and first document by default
    if (documents.length > 0 && documents[0].sub_titles.length > 0) {
      toggleDropdown(0);
      loadDocument(0, 0);
    }
  </script>
</body>

</html>
