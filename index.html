  <script>
    const documents = [{"phase": "เนื้อหา · OVERVIEW", "title": "Overview", "sub_titles": [{"title": "ภาพรวมโปรเจค — Scam Image Detection", "path": "web-ScamGuard/overview.html"}]}, {"phase": "เนื้อหา · ARCHITECTURE", "title": "Architecture", "sub_titles": [{"title": "AI Inference Service", "path": "web-ScamGuard/architecture/ai-inference-service.html"}, {"title": "Backend API — FastAPI Orchestrator", "path": "web-ScamGuard/architecture/backend-api.html"}, {"title": "C1 System Context Diagram", "path": "web-ScamGuard/architecture/c1-system-context-diagram.html"}, {"title": "C2 Container Diagram", "path": "web-ScamGuard/architecture/c2-container-diagram.html"}, {"title": "Entity Relationship Diagram (ER Diagram)", "path": "web-ScamGuard/architecture/database-er-diagram.html"}, {"title": "Mobile App Architecture", "path": "web-ScamGuard/architecture/mobile-design.html"}, {"title": "System Flowchart", "path": "web-ScamGuard/architecture/flowchart.html"}, {"title": "UX/UI & System Design Overview", "path": "web-ScamGuard/architecture/design-overview.html"}, {"title": "การเชื่อมต่อบริการภายนอก (External Integrations)", "path": "web-ScamGuard/architecture/external-integrations.html"}, {"title": "สถาปัตยกรรม Mobile App", "path": "web-ScamGuard/architecture/mobile-app.html"}, {"title": "สถาปัตยกรรมระบบ (System Architecture)", "path": "web-ScamGuard/architecture/system-architecture.html"}, {"title": "โครงสร้างฐานข้อมูลและการจัดเก็บข้อมูล", "path": "web-ScamGuard/architecture/database-schema.html"}]}, {"phase": "เนื้อหา · CONCEPTS", "title": "Concepts", "sub_titles": [{"title": "AI Model Training Workflow", "path": "web-ScamGuard/concepts/model-training.html"}, {"title": "Semantic Segmentation", "path": "web-ScamGuard/concepts/semantic-segmentation.html"}, {"title": "การคำนวณคะแนนความเสี่ยง (Risk Scoring)", "path": "web-ScamGuard/concepts/risk-scoring.html"}, {"title": "การวิเคราะห์หลายชั้น (Multi-layer Analysis)", "path": "web-ScamGuard/concepts/multi-layer-analysis.html"}, {"title": "ปัญญาประดิษฐ์ที่อธิบายได้ (Explainable AI / XAI)", "path": "web-ScamGuard/concepts/explainable-ai.html"}, {"title": "โมเดล AI — SegFormer", "path": "web-ScamGuard/concepts/ai-model-segformer.html"}, {"title": "โมเดล AI — Surya OCR", "path": "web-ScamGuard/concepts/surya-ocr.html"}]}, {"phase": "เนื้อหา · REQUIREMENTS", "title": "Requirements", "sub_titles": [{"title": "Software Requirements Specification (SRS)", "path": "web-ScamGuard/requirements/srs.html"}, {"title": "Use Case Diagram", "path": "web-ScamGuard/requirements/use-case-diagram.html"}, {"title": "ความต้องการที่ไม่ใช่ฟังก์ชัน (Non-Functional Requirements)", "path": "web-ScamGuard/requirements/non-functional-requirements.html"}, {"title": "ความต้องการเชิงฟังก์ชัน (Functional Requirements)", "path": "web-ScamGuard/requirements/functional-requirements.html"}, {"title": "วัตถุประสงค์และตัวชี้วัดความสำเร็จ (Objectives & KPIs)", "path": "web-ScamGuard/requirements/objectives-kpis.html"}]}, {"phase": "เนื้อหา · ENTITIES", "title": "Entities", "sub_titles": [{"title": "ผู้ใช้ระบบ (Actors)", "path": "web-ScamGuard/entities/actors.html"}, {"title": "เทคโนโลยีที่ใช้ (Technology Stack)", "path": "web-ScamGuard/entities/tech-stack.html"}]}, {"phase": "เนื้อหา · PLANNING", "title": "Planning", "sub_titles": [{"title": "Backend Documentation", "path": "web-ScamGuard/planning/backend-documentation.html"}, {"title": "ขอบเขตโครงการ (Project Scope)", "path": "web-ScamGuard/planning/project-scope.html"}, {"title": "ทีมงานและผู้รับผิดชอบ (Team)", "path": "web-ScamGuard/planning/team.html"}]}, {"phase": "เนื้อหา · DECISIONS", "title": "Decisions", "sub_titles": [{"title": "การตัดสินใจเลือกเทคโนโลยี (Technology Choices)", "path": "web-ScamGuard/decisions/technology-choices.html"}]}];
    const frame = document.getElementById('contentFrame');
    const navItems = [...document.querySelectorAll('.nav-item')];

    function toggleDropdown(index) {
      const navItem = document.querySelector(`.nav-item[data-cat="${index}"]`);
      const subContainer = document.getElementById(`cat-${index}`);
      const isExpanded = navItem.classList.contains('is-expanded');

      // Close all others
      document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('is-expanded'));
      document.querySelectorAll('.sub-menu-container').forEach(container => container.style.display = 'none');

      // Toggle current
      if (!isExpanded) {
        navItem.classList.add('is-expanded');
        subContainer.style.display = 'block';
      }
    }

    function loadDocument(catIndex, subIndex) {
      const doc = documents[catIndex];
      const subDoc = doc.sub_titles[subIndex];

      // Update UI breadcrumbs
      document.getElementById('breadcrumb').textContent = doc.phase;
      document.getElementById('documentTitle').textContent = subDoc.title;
      document.getElementById('documentNumber').textContent = `DOC ${String(catIndex + 1).padStart(2, '0')}`;

      // Update active sub-item
      document.querySelectorAll('.sub-item').forEach(el => el.classList.remove('is-active'));
      const activeSubBtn = document.querySelector(`.sub-item[data-cat="${catIndex}"][data-sub="${subIndex}"]`);
      if (activeSubBtn) activeSubBtn.classList.add('is-active');

      // Load iframe
      frame.title = subDoc.title;
      frame.src = subDoc.path;
    }

    // Mobile sidebar toggle
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.querySelector('.sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleSidebar() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
      
      // Handle display change for transition
      if (overlay.classList.contains('open')) {
        overlay.style.display = 'block';
        setTimeout(() => overlay.style.opacity = '1', 10);
      } else {
        overlay.style.opacity = '0';
        setTimeout(() => {
          if(!overlay.classList.contains('open')) overlay.style.display = 'none';
        }, 300);
      }
    }

    menuBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', toggleSidebar);

    document.addEventListener('click', (e) => {
      const navItem = e.target.closest('.nav-item');
      if (navItem) {
        const index = Number(navItem.dataset.cat);
        toggleDropdown(index);
      }

      const subItem = e.target.closest('.sub-item');
      if (subItem) {
        const catIndex = Number(subItem.dataset.cat);
        const subIndex = Number(subItem.dataset.sub);
        loadDocument(catIndex, subIndex);
        
        // Auto-close sidebar on mobile after selecting a document
        if (window.innerWidth <= 850 && sidebar.classList.contains('open')) {
          toggleSidebar();
        }
      }
    });

    // Open first category and first document by default
    if (documents.length > 0 && documents[0].sub_titles.length > 0) {
      toggleDropdown(0);
      loadDocument(0, 0);
    }
  </script>
