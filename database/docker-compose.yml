version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scamguard_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scamguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-scamguard_db}
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - scamguard_net

  redis:
    image: redis:7-alpine
    container_name: scamguard_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - scamguard_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: scamguard_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scamguard.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - scamguard_net

volumes:
  postgres_data:
  redis_data:

networks:
  scamguard_net:
    driver: bridge
