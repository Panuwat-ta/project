name: automate_test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  automate_test:
    name: automate_test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://scamguard:password@localhost:5432/scamguard_db
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_ORIGINS: "*"
      JWT_SECRET_KEY: ci-test-jwt-secret-key-32-chars-long-testing
      ONNX_MODEL_PATH: model/segformer/work_dirs/v1.0.0/segformer_v1_0_0_dynamic.onnx
      XAI_MODEL_PATH: model/Qwen2.5-1.5B/qwen2.5-1.5b-instruct-q4_k_m.gguf
      TEST_USER_EMAIL: automate_test_user@example.com
      TEST_USER_PASSWORD: TestPassword123!
      TEST_ADMIN_EMAIL: admin@scamguard.local
      TEST_ADMIN_PASSWORD: AdminPassword123!
      BASE_URL: ""
      TESTING: "true"

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: scamguard
          POSTGRES_PASSWORD: password
          POSTGRES_DB: scamguard_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: tests_all/automate_tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests_all/automate_tests/requirements.txt

      - name: Run database migrations
        run: |
          cd server
          alembic upgrade head

      - name: Run automated tests (API & E2E)
        run: |
          cd tests_all/automate_tests
          pytest tests/api tests/e2e -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automate-test-reports
          path: tests_all/automate_tests/reports/
